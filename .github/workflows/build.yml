name: Build EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build RichPresence.exe
        shell: powershell
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RichPresence
          path: dist/RichPresence.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RichPresence.exe
