name: Build EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write          # attach the EXE to the release
  id-token: write          # OIDC token for the build attestation
  attestations: write      # publish the build provenance attestation
  artifact-metadata: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build RichPresence.exe
        shell: powershell
        run: ./build.ps1

      # Proof that this exact EXE was built by this repo's workflow (verify with: gh attestation verify)
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/RichPresence.exe

      - uses: actions/upload-artifact@v4
        with:
          name: RichPresence
          path: dist/RichPresence.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RichPresence.exe
          body_path: RELEASE_NOTES.md
          name: RichPresence ${{ github.ref_name }}
