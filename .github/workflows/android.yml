name: Build Android

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SDK_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      # Discord's SDK can't be in this public repo; with it, the APK can link a Discord account.
      - name: Get Discord's SDK (private repo)
        if: env.SDK_TOKEN != ''
        uses: actions/checkout@v5
        with:
          repository: noice912/RichPresence-sdk
          token: ${{ secrets.SDK_REPO_TOKEN }}
          path: private-sdk

      - name: Put the SDK in place
        run: |
          if [ -f private-sdk/android/discord_partner_sdk.aar ]; then
            cp -R private-sdk/android/. android/sdk/
            echo "Building with Discord linking"
          else
            echo "::warning title=Android::Discord's SDK isn't available (SDK_REPO_TOKEN), so this APK can't link Discord."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        working-directory: android
        run: bash ci.sh testDebugUnitTest

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            echo 'Signing with the release key'
          else
            echo '::warning title=signing::No release key secrets set; this APK uses a throwaway key and cannot update an earlier install.'
          fi
          bash ci.sh assembleRelease

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # install it on a real Android emulator, open it, start the presence and check nothing crashes
      - name: Smoke-test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RichPresence-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RichPresence-android
          path: RichPresence-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RichPresence-android.apk
