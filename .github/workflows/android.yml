name: Build Android

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        working-directory: android
        run: bash ci.sh testDebugUnitTest

      - name: Build APK
        working-directory: android
        run: bash ci.sh assembleRelease

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      # install it on a real Android emulator, open it, start the presence and check nothing crashes
      - name: Smoke-test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/smoke.sh android/app/build/outputs/apk/release/app-release.apk

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk RichPresence-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RichPresence-android
          path: RichPresence-android.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RichPresence-android.apk
