name: Build Linux

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['linux/**', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: write          # attach the files to the release
  id-token: write          # OIDC token for the build attestation
  attestations: write
  artifact-metadata: write

jobs:
  linux:
    runs-on: ubuntu-22.04    # oldest supported glibc, so the build runs on more distros
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils dbus-x11

      - name: Tests (fake Steam library + fake Discord)
        working-directory: linux
        run: |
          python -m pip install --quiet jeepney
          python tests/test_linux.py

      - name: Build AppImage and .deb
        working-directory: linux
        run: bash build.sh

      - name: Smoke-test the built files
        run: |
          fail() { echo "::error title=smoke::$1 $(tail -c 2500 "${2:-/dev/null}" | tr '\n' ' ')"; exit 1; }
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./dist/RichPresence-x86_64.AppImage --version > v.log 2>&1 || fail 'AppImage --version failed:' v.log
          cat v.log
          # open the real window on a virtual screen for a few seconds; it must still be running
          export RICHPRESENCE_DATA=$(mktemp -d)
          code=0
          timeout 15 xvfb-run -a ./dist/RichPresence-x86_64.AppImage > smoke.log 2>&1 || code=$?
          cat smoke.log
          [ "$code" = "124" ] || fail "window exited early with $code:" smoke.log
          # the virtual screen has no system tray, so the tray icon can't dock there; anything else is a real error
          [ "$(grep -c Traceback smoke.log)" -le "$(grep -c 'Failed to dock icon' smoke.log)" ] || fail 'traceback while running:' smoke.log
          sudo apt-get install -y ./dist/richpresence_*_amd64.deb > deb.log 2>&1 || fail 'deb install failed:' deb.log
          richpresence --version > dv.log 2>&1 || fail 'installed richpresence --version failed:' dv.log
          cat dv.log

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/RichPresence-x86_64.AppImage
            dist/richpresence_*_amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: RichPresence-linux
          path: |
            dist/RichPresence-x86_64.AppImage
            dist/richpresence_*_amd64.deb
            dist/SHA256SUMS-linux.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RichPresence-x86_64.AppImage
            dist/richpresence_*_amd64.deb
            dist/SHA256SUMS-linux.txt
